name: Publish scheduled /her notes

# Publishes pre-prepared handwritten-note commits to main on a schedule, so
# notes can go live while nobody is online.
#
# Each note lives on its own `publish/YYYY-MM-DD` branch, stacked so that each
# branch contains every earlier note. On each run this job picks the newest
# branch whose release time has passed and merges it into main.
#
# Self-healing by design: a missed, delayed, or failed run is corrected by the
# next sweep, and because the branches are stacked, one late run still
# publishes everything that is due. Merging (rather than fast-forwarding) means
# it keeps working no matter what else lands on main in the meantime.
#
# To schedule another note: push a `publish/<date>` branch stacked on the last
# one, add a line to RELEASES, and add a cron entry.

on:
  schedule:
    - cron: '5 17 14 8 *'   # Aug 14, 10:05 AM PDT
    - cron: '5 10 15 8 *'   # Aug 15, 03:05 AM PDT
    - cron: '5 10 16 8 *'   # Aug 16, 03:05 AM PDT
    - cron: '*/20 * * * *'  # catch-up sweep; no-ops when nothing is due
  workflow_dispatch:

# Oldest first. Format: <release time, UTC> <branch>
env:
  RELEASES: |
    2026-08-14T17:00:00Z publish/2026-08-14
    2026-08-15T10:00:00Z publish/2026-08-15
    2026-08-16T10:00:00Z publish/2026-08-16

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish whatever is due
        run: |
          set -euo pipefail

          now=$(date -u +%s)

          # Walk oldest to newest, keeping the last branch whose time has passed.
          target=""
          while read -r when branch; do
            [ -z "${when:-}" ] && continue
            if [ "$now" -ge "$(date -u -d "$when" +%s)" ]; then
              target="$branch"
            fi
          done <<< "$RELEASES"

          if [ -z "$target" ]; then
            echo "Nothing due yet."
            exit 0
          fi

          echo "Newest due branch: $target"
          git fetch origin "$target" main
          sha=$(git rev-parse "origin/$target")

          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "main already contains $sha ($target) — nothing to publish."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B main origin/main
          git merge --no-edit "$sha" -m "Publish $target"
          git push origin main

          echo "Published $target. main is now $(git rev-parse --short HEAD)."
