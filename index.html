<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keogan Larade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #faf6ee;
      color: #2a2a2a;
      -webkit-font-smoothing: antialiased;
      padding: 7rem 1.75rem 4rem;
      max-width: 480px;
      margin-inline: auto;
    }
    .name {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: 0.005em;
      margin: 0 0 4.5rem;
    }
    .blurb {
      font-family: Charter, 'Charter BT', 'Iowan Old Style', Georgia, serif;
      font-size: 1.1rem;
      line-height: 1.7;
      color: #3a3a3a;
      margin: 0 0 4.5rem;
    }
    .images {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      aspect-ratio: 3 / 1;
    }
    .images > div {
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
    }
    .images .left  { flex: 2; }
    .images .right { flex: 1; }
    .images img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <h1 class="name">Keogan Larade</h1>
  <p class="blurb">I care most about building things and understanding things. Lately, that's taken shape in quantum computing, music, and art.</p>
  <div class="images">
    <div class="left"><img src="images/canoe.jpg" alt=""></div>
    <div class="right"><img src="images/portrait.jpg" alt=""></div>
  </div>
</body>
</html>
