<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keogan Larade</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: #2a2a2a;
      font-family: 'Iowan Old Style', 'Palatino', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      padding: 4rem 1.75rem 3rem;
      max-width: 480px;
      margin-inline: auto;
    }
    .name {
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      margin: 0 0 2.5rem;
    }
    .blurb {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #4a4a4a;
      margin: 0 0 2.5rem;
    }
    .images {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      aspect-ratio: 3 / 1;
    }
    .images > div {
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
    }
    .images .left  { flex: 2; }
    .images .right { flex: 1; }
    .images img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <h1 class="name">Keogan Larade</h1>
  <p class="blurb">I care most about building things and understanding things. Lately, that's taken shape in quantum computing, music, and art.</p>
  <div class="images">
    <div class="left"></div>
    <div class="right"></div>
  </div>
</body>
</html>
