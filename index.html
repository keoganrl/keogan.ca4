<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keogan Larade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fdfbf7;
      color: #2a2a2a;
      -webkit-font-smoothing: antialiased;
      padding: 7rem 1.75rem 4rem;
      max-width: 480px;
      margin-inline: auto;
    }
    .name {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: 0.005em;
      margin: 0 0 4.5rem;
    }
    .blurb {
      font-family: Charter, 'Charter BT', 'Iowan Old Style', Georgia, serif;
      font-size: 1.1rem;
      line-height: 1.7;
      color: #3a3a3a;
      margin: 0 0 4.5rem;
    }
    .images {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      aspect-ratio: 7 / 2;
      overflow: hidden;
      margin: 5rem 0;
    }
    .images > div {
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
      min-height: 0;
      height: 100%;
    }
    .images .left  { flex: 2; }
    .images .right { flex: 1; }
    .images img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .directory {
      margin-top: 4.5rem;
      font-family: Charter, 'Charter BT', 'Iowan Old Style', Georgia, serif;
    }
    .directory h2 {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 1.05rem;
      font-weight: 400;
      color: #2a2a2a;
      margin: 0 0 1.25rem;
    }
    .directory ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .directory li {
      margin: 0.5rem 0;
      font-size: 1.0rem;
      line-height: 1.6;
    }
    .directory a {
      color: #3a3a3a;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }
    .directory a:hover {
      border-bottom-color: #b8b8b8;
    }
    .directory .slash {
      color: #a8a8a8;
      margin-right: 0.5rem;
    }
    .directory .arrow {
      color: #a8a8a8;
      margin-left: 0.35rem;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <h1 class="name">Keogan Larade</h1>
  <p class="blurb">I care most about building things and understanding things. Lately, that's taken shape in quantum computing, music, and art.</p>
  <div class="images">
    <div class="left"><img src="images/canoe.jpg" alt=""></div>
    <div class="right"><img src="images/portrait.jpg" alt=""></div>
  </div>
  <section class="directory">
    <h2>Directory</h2>
    <ul>
      <li><a href="#"><span class="slash">/</span>writing</a></li>
      <li><a href="#"><span class="slash">/</span>projects</a></li>
      <li><a href="#"><span class="slash">/</span>guestbook</a></li>
      <li><a href="https://www.linkedin.com/in/keoganlarade/" target="_blank" rel="noopener">LinkedIn<span class="arrow">↗</span></a></li>
      <li><a href="https://www.youtube.com/@keoganlarademusic918/" target="_blank" rel="noopener">YouTube<span class="arrow">↗</span></a></li>
      <li><a href="https://www.albumoftheyear.org/user/keogan/" target="_blank" rel="noopener">Album of the Year<span class="arrow">↗</span></a></li>
      <li><a href="https://www.goodreads.com/user/show/153042134-keogan-larade" target="_blank" rel="noopener">Goodreads<span class="arrow">↗</span></a></li>
    </ul>
  </section>
</body>
</html>
